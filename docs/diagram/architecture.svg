<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', 'SF Mono', monospace; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="#0f172a"/>
  <rect width="1200" height="820" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="35" fill="white" font-size="16" font-weight="700">i18n-automatically Architecture</text>
  <text x="30" y="52" fill="#64748b" font-size="9">VS Code 国际化插件 · 系统架构图</text>

  <!-- ==================== Layer 1: User Trigger ==================== -->
  <rect x="40" y="80" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="40" y="80" width="200" height="70" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="140" y="110" fill="white" font-size="11" font-weight="600" text-anchor="middle">VS Code 用户触发</text>
  <text x="140" y="130" fill="#94a3b8" font-size="9" text-anchor="middle">右键菜单 / 命令面板</text>

  <!-- ==================== Layer 2: Extension Entry ==================== -->
  <rect x="310" y="80" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="310" y="80" width="200" height="70" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="410" y="110" fill="white" font-size="11" font-weight="600" text-anchor="middle">extension.js</text>
  <text x="410" y="130" fill="#94a3b8" font-size="9" text-anchor="middle">注册 6 个命令</text>

  <!-- Arrow: User -> Entry -->
  <line x1="240" y1="115" x2="308" y2="115" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- ==================== Layer 2: Commands (grouped) ==================== -->
  <!-- Region: Commands -->
  <rect x="570" y="70" width="600" height="100" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="582" y="86" fill="#22d3ee" font-size="9" font-weight="600">Commands</text>

  <rect x="585" y="96" width="110" height="50" rx="4" fill="#0f172a"/>
  <rect x="585" y="96" width="110" height="50" rx="4" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="640" y="118" fill="white" font-size="9" font-weight="600" text-anchor="middle">单文件扫描</text>
  <text x="640" y="133" fill="#94a3b8" font-size="8" text-anchor="middle">scanChinese</text>

  <rect x="710" y="96" width="110" height="50" rx="4" fill="#0f172a"/>
  <rect x="710" y="96" width="110" height="50" rx="4" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="765" y="118" fill="white" font-size="9" font-weight="600" text-anchor="middle">批量扫描</text>
  <text x="765" y="133" fill="#94a3b8" font-size="8" text-anchor="middle">scanChineseBatch</text>

  <rect x="835" y="96" width="110" height="50" rx="4" fill="#0f172a"/>
  <rect x="835" y="96" width="110" height="50" rx="4" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="890" y="118" fill="white" font-size="9" font-weight="600" text-anchor="middle">语言切换</text>
  <text x="890" y="133" fill="#94a3b8" font-size="8" text-anchor="middle">switchLanguage</text>

  <rect x="960" y="96" width="110" height="50" rx="4" fill="#0f172a"/>
  <rect x="960" y="96" width="110" height="50" rx="4" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="1015" y="118" fill="white" font-size="9" font-weight="600" text-anchor="middle">生成语言包</text>
  <text x="1015" y="133" fill="#94a3b8" font-size="8" text-anchor="middle">generateLangPkg</text>

  <!-- Arrow: Entry -> Commands -->
  <line x1="510" y1="115" x2="583" y2="115" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- ==================== Layer 3: Core Processor ==================== -->
  <!-- Region: I18nProcessor -->
  <rect x="100" y="200" width="700" height="210" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="112" y="216" fill="#34d399" font-size="9" font-weight="600">I18nProcessor (核心处理)</text>

  <!-- Orchestrator -->
  <rect x="120" y="230" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="120" y="230" width="200" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="220" y="260" fill="white" font-size="11" font-weight="600" text-anchor="middle">I18nProcessor</text>
  <text x="220" y="280" fill="#94a3b8" font-size="9" text-anchor="middle">编排器：分发 + Prettier + 写入</text>

  <!-- JS Processor -->
  <rect x="370" y="230" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="370" y="230" width="200" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="470" y="255" fill="white" font-size="11" font-weight="600" text-anchor="middle">jsProcessor</text>
  <text x="470" y="272" fill="#94a3b8" font-size="9" text-anchor="middle">Babel AST</text>
  <text x="470" y="287" fill="#94a3b8" font-size="8" text-anchor="middle">JS / JSX / TS / TSX</text>

  <!-- Vue Processor -->
  <rect x="370" y="320" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="370" y="320" width="200" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="470" y="345" fill="white" font-size="11" font-weight="600" text-anchor="middle">vueProcessor</text>
  <text x="470" y="362" fill="#94a3b8" font-size="9" text-anchor="middle">Vue Compiler SFC</text>
  <text x="470" y="377" fill="#94a3b8" font-size="8" text-anchor="middle">.vue Template / Script</text>

  <!-- Common -->
  <rect x="120" y="320" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="120" y="320" width="200" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="220" y="345" fill="white" font-size="11" font-weight="600" text-anchor="middle">common.js</text>
  <text x="220" y="365" fill="#94a3b8" font-size="9" text-anchor="middle">generateKey / TranslationManager</text>

  <!-- Arrows inside processor -->
  <line x1="320" y1="265" x2="368" y2="265" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
  <line x1="320" y1="280" x2="368" y2="355" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrow-emerald)" stroke-opacity="0.5"/>
  <line x1="370" y1="300" x2="320" y2="320" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.4"/>
  <line x1="370" y1="355" x2="320" y2="355" stroke="#34d399" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.4"/>

  <!-- ==================== Layer 3 right: Config ==================== -->
  <rect x="850" y="230" width="200" height="70" rx="6" fill="#0f172a"/>
  <rect x="850" y="230" width="200" height="70" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="950" y="260" fill="white" font-size="11" font-weight="600" text-anchor="middle">setting.js</text>
  <text x="950" y="280" fill="#94a3b8" font-size="9" text-anchor="middle">配置管理（读写 + 自动创建）</text>

  <!-- Arrow: Orchestrator -> Config -->
  <line x1="320" y1="248" x2="848" y2="248" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6,3" marker-end="url(#arrow-amber)" stroke-opacity="0.5"/>

  <!-- ==================== Layer 4: Translation Service ==================== -->
  <!-- Region: Translation Services -->
  <rect x="100" y="445" width="700" height="110" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="112" y="461" fill="#a78bfa" font-size="9" font-weight="600">Translation Layer (翻译服务)</text>

  <!-- Factory -->
  <rect x="120" y="475" width="160" height="60" rx="6" fill="#0f172a"/>
  <rect x="120" y="475" width="160" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="200" y="500" fill="white" font-size="10" font-weight="600" text-anchor="middle">Translator Factory</text>
  <text x="200" y="518" fill="#94a3b8" font-size="8" text-anchor="middle">createTranslator()</text>

  <!-- Google -->
  <rect x="330" y="475" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="330" y="475" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="400" y="500" fill="white" font-size="10" font-weight="600" text-anchor="middle">Google 翻译</text>
  <text x="400" y="518" fill="#94a3b8" font-size="8" text-anchor="middle">免费 · 无需配置</text>

  <!-- Baidu -->
  <rect x="500" y="475" width="140" height="60" rx="6" fill="#0f172a"/>
  <rect x="500" y="475" width="140" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="570" y="500" fill="white" font-size="10" font-weight="600" text-anchor="middle">百度翻译</text>
  <text x="570" y="518" fill="#94a3b8" font-size="8" text-anchor="middle">MD5 签名 · axios</text>

  <!-- DeepL -->
  <rect x="670" y="475" width="110" height="60" rx="6" fill="#0f172a"/>
  <rect x="670" y="475" width="110" height="60" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="725" y="500" fill="white" font-size="10" font-weight="600" text-anchor="middle">DeepL</text>
  <text x="725" y="518" fill="#94a3b8" font-size="8" text-anchor="middle">Free / Pro</text>

  <!-- Arrows: Factory -> Services -->
  <line x1="280" y1="505" x2="328" y2="505" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrow-violet)"/>
  <line x1="280" y1="505" x2="498" y2="505" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrow-violet)" stroke-opacity="0.6"/>
  <line x1="280" y1="505" x2="668" y2="505" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrow-violet)" stroke-opacity="0.4"/>

  <!-- Arrow: TranslationManager -> Factory -->
  <path d="M 220 390 L 220 420 L 200 420 L 200 473" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="225" y="435" fill="#a78bfa" font-size="7">写入 zh.json 后翻译</text>

  <!-- ==================== Layer 5: Output ==================== -->
  <!-- Region: Output / Language Packs -->
  <rect x="100" y="590" width="700" height="110" rx="12" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="112" y="606" fill="#fb7185" font-size="9" font-weight="600">Output (输出)</text>

  <!-- Source File (modified) -->
  <rect x="120" y="620" width="170" height="60" rx="6" fill="#0f172a"/>
  <rect x="120" y="620" width="170" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="205" y="645" fill="white" font-size="10" font-weight="600" text-anchor="middle">源代码文件</text>
  <text x="205" y="663" fill="#94a3b8" font-size="8" text-anchor="middle">中文 → $t('key')</text>

  <!-- zh.json -->
  <rect x="330" y="620" width="150" height="60" rx="6" fill="#0f172a"/>
  <rect x="330" y="620" width="150" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="405" y="645" fill="white" font-size="10" font-weight="600" text-anchor="middle">zh.json</text>
  <text x="405" y="663" fill="#94a3b8" font-size="8" text-anchor="middle">中文语言包</text>

  <!-- en.json / ja.json ... -->
  <rect x="520" y="620" width="150" height="60" rx="6" fill="#0f172a"/>
  <rect x="520" y="620" width="150" height="60" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="595" y="645" fill="white" font-size="10" font-weight="600" text-anchor="middle">en / ja / ko.json</text>
  <text x="595" y="663" fill="#94a3b8" font-size="8" text-anchor="middle">翻译后语言包</text>

  <!-- Arrows: Processor -> Output -->
  <path d="M 220 390 L 220 610 L 205 618" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <path d="M 220 390 L 220 610 L 405 618" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>

  <!-- Arrow: Translation -> Output -->
  <path d="M 500 535 L 500 560 L 595 560 L 595 618" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>

  <!-- ==================== Layer: Inline Decoration (right side) ==================== -->
  <rect x="850" y="340" width="200" height="100" rx="6" fill="#0f172a"/>
  <rect x="850" y="340" width="200" height="100" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="950" y="370" fill="white" font-size="11" font-weight="600" text-anchor="middle">switchLanguage.js</text>
  <text x="950" y="390" fill="#94a3b8" font-size="9" text-anchor="middle">内联装饰器</text>
  <text x="950" y="405" fill="#94a3b8" font-size="8" text-anchor="middle">VS Code Decoration API</text>
  <text x="950" y="420" fill="#94a3b8" font-size="8" text-anchor="middle">编辑器中预览翻译文本</text>

  <!-- Arrow: zh.json -> Decoration -->
  <path d="M 480 650 L 830 650 L 830 440 L 848 440" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-amber)"/>
  <text x="835" y="555" fill="#fbbf24" font-size="7" transform="rotate(-90, 835, 555)">读取语言包</text>

  <!-- ==================== Data Flow Annotation ==================== -->
  <!-- Vertical flow arrow on far left -->
  <line x1="50" y1="155" x2="50" y2="600" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-cyan)"/>
  <text x="45" y="260" fill="#60a5fa" font-size="7" text-anchor="end" transform="rotate(-90, 45, 260)">数据流方向</text>

  <!-- Flow labels along left side -->
  <text x="65" y="178" fill="#94a3b8" font-size="7">① 触发命令</text>
  <text x="65" y="218" fill="#94a3b8" font-size="7">② AST 解析 &amp; 替换</text>
  <text x="65" y="438" fill="#94a3b8" font-size="7">③ 翻译</text>
  <text x="65" y="582" fill="#94a3b8" font-size="7">④ 输出</text>

  <!-- ==================== Legend ==================== -->
  <rect x="850" y="600" width="300" height="140" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="870" y="622" fill="white" font-size="10" font-weight="600">图例 Legend</text>

  <rect x="870" y="635" width="12" height="8" rx="2" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="890" y="643" fill="#94a3b8" font-size="8">用户交互层</text>

  <rect x="870" y="655" width="12" height="8" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="890" y="663" fill="#94a3b8" font-size="8">命令注册层</text>

  <rect x="870" y="675" width="12" height="8" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="890" y="683" fill="#94a3b8" font-size="8">核心处理层</text>

  <rect x="870" y="695" width="12" height="8" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="890" y="703" fill="#94a3b8" font-size="8">翻译服务层</text>

  <rect x="870" y="715" width="12" height="8" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1"/>
  <text x="890" y="723" fill="#94a3b8" font-size="8">输出层</text>

  <line x1="1000" y1="639" x2="1030" y2="639" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="1038" y="643" fill="#94a3b8" font-size="8">数据流</text>

  <line x1="1000" y1="659" x2="1030" y2="659" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="1038" y="663" fill="#94a3b8" font-size="8">配置/读取</text>

  <rect x="1000" y="672" width="40" height="12" rx="4" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="1048" y="683" fill="#94a3b8" font-size="8">模块边界</text>
</svg>
